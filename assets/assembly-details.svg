f" font-size="14" fill="#172534" text-anchor="start" font-weight="400">D3 · CEILING MIRROR HOLD POINT</text><text x="55" y="851" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">Approve panel modules, weight, support structure, retention and accessible lighting</text><text x="55" y="878" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">as one overhead assembly. Site verification + support designer + glazier release it.</text><text x="55" y="905" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">The render and this guide supply appearance and coordination, not engineering.</text><line x1="38" y1="986" x2="722" y2="986" stroke="#c7d3e0" stroke-width="1"/><text x="38" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#172534" text-anchor="start" font-weight="400">TRC REHEARSAL ROOM 2 · CURRENT WEB DRAWING v1.5 · DIMENSIONS IN INCHES</text><text x="722" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#875700" text-anchor="end" font-weight="400">ISSUED 2026-09-28 · FIELD RELEASE REQUIRED</text></svg>