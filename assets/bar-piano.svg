<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-label="A03 / WEST BAR + PIANO ELEVATION"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#a43535" stroke-width="1.4"/></pattern></defs><style>text{font-family:Arial,sans-serif}.small{font-size:11px}</style><rect width="760" height="1030" fill="white"/><text x="38" y="36" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#172534" text-anchor="start" font-weight="700">A03 / WEST BAR + PIANO ELEVATION</text><text x="38" y="61" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#526474" text-anchor="start" font-weight="400">Current proposed coordinates and maker bodies; field layout and millwork shop drawings control.</text><line x1="38" y1="78" x2="722" y2="78" stroke="#c7d3e0" stroke-width="1"/><rect x="55.0" y="165.0" width="602.0" height="285.59999999999997" rx="0" fill="#f7f9fc" stroke="#172534"/><rect x="141.8" y="333.0" width="134.39999999999998" height="117.6" rx="0" fill="#d9e5f4" stroke="#295fbb"/><text x="209.0" y="394.6" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="middle" font-weight="400">BAR-01</text><rect x="141.8" y="282.6" width="134.39999999999998" height="4.199999999999999" rx="0" fill="#c8d8eb" stroke="#295fbb"/><rect x="141.8" y="232.2" width="134.39999999999998" height="4.199999999999999" rx="0" fill="#c8d8eb" stroke="#295fbb"/><rect x="322.22499999999997" y="337.725" width="165.54999999999998" height="112.87499999999999" rx="0" fill="#283542" stroke="#172534"/><text x="405.0" y="391.79999999999995" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="400">YAMAHA NU1X</text><line x1="276.2" y1="492.59999999999997" x2="141.8" y2="492.59999999999997" stroke="#295fbb" stroke-width="1"/><line x1="276.2" y1="486.59999999999997" x2="276.2" y2="498.59999999999997" stroke="#295fbb" stroke-width="1"/><line x1="141.8" y1="486.59999999999997" x2="141.8" y2="498.59999999999997" stroke="#295fbb" stroke-width="1"/><text x="209.0" y="484.59999999999997" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400">48 maker length</text><line x1="487.775" y1="492.59999999999997" x2="322.22499999999997" y2="492.59999999999997" stroke="#295fbb" stroke-width="1"/><line x1="487.775" y1="486.59999999999997" x2="487.775" y2="498.59999999999997" stroke="#295fbb" stroke-width="1"/><line x1="322.22499999999997" y1="486.59999999999997" x2="322.22499999999997" y2="498.59999999999997" stroke="#295fbb" stroke-width="1"/><text x="405.0" y="484.59999999999997" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400">59⅛ maker width</text><line x1="322.22499999999997" y1="473.0" x2="276.2" y2="473.0" stroke="#295fbb" stroke-width="1"/><line x1="322.22499999999997" y1="467.0" x2="322.22499999999997" y2="479.0" stroke="#295fbb" stroke-width="1"/><line x1="276.2" y1="467.0" x2="276.2" y2="479.0" stroke="#295fbb" stroke-width="1"/><text x="299.2125" y="465.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400">16.4375 proposed gap</text><line x1="685" y1="450.59999999999997" x2="685" y2="333.0" stroke="#295fbb" stroke-width="1"/><line x1="679" y1="450.59999999999997" x2="691" y2="450.59999999999997" stroke="#295fbb" stroke-width="1"/><line x1="679" y1="333.0" x2="691" y2="333.0" stroke="#295fbb" stroke-width="1"/><text x="702" y="391.79999999999995" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400" transform="rotate(-90 702 391.79999999999995)">42 counter D</text><text x="293.0" y="229.39999999999998" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#295fbb" text-anchor="end" font-weight="400">78 AFF D</text><text x="293.0" y="279.8" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#295fbb" text-anchor="end" font-weight="400">60 AFF D</text><text x="55" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#295fbb" text-anchor="start" font-weight="400">SOUTH / VIEWER LEFT</text><text x="657" y="143" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#295fbb" text-anchor="end" font-weight="400">NORTH / VIEWER RIGHT</text><text x="55" y="535" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172534" text-anchor="start" font-weight="400">FRIDGE COORDINATION · BAR-05</text><text x="55" y="563" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172534" text-anchor="start" font-weight="400">Zephyr PRB15C01CG: 15 W × 23⅜ D × 33⅞–34⅞ H in.</text><text x="55" y="591" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172534" text-anchor="start" font-weight="400">Minimum opening 15⅛ W × 34 H in; allow 1 in behind for plug.</text><text x="55" y="619" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#172534" text-anchor="start" font-weight="400">Proposed 26 in cabinet depth still needs a shop drawing and occupied fit test.</text><text x="55" y="649" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#295fbb" text-anchor="start" font-weight="400">Model centers: NU1X x9.5/z90/270° · bar x13/z160/270° · 16.4375 in body gap.</text><rect x="55" y="665" width="650" height="115" rx="5" fill="#fff4dd" stroke="#875700"/><text x="75" y="695" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#875700" text-anchor="start" font-weight="400">THREE STOOLS REMAIN A DESIGN HOLD</text><text x="75" y="722" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#875700" text-anchor="start" font-weight="400">48 in / 3 = 16 in of bar run per seat. Source stools sit 18 in apart.</text><text x="75" y="749" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#875700" text-anchor="start" font-weight="400">Mock up three occupied stools, fridge open, and piano bench in use.</text><text x="55" y="827" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">COUNTER + FLOOR SEQUENCE</text><text x="55" y="854" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">Set the finished-floor datum → install carcass → template stone → fit appliances.</text><text x="55" y="881" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">No sink or water service is included. Front vent and pull-out access stay clear.</text><line x1="38" y1="986" x2="722" y2="986" stroke="#c7d3e0" stroke-width="1"/><text x="38" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#172534" text-anchor="start" font-weight="400">TRC REHEARSAL ROOM 2 · CURRENT WEB DRAWING v1.5 · DIMENSIONS IN INCHES</text><text x="722" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#875700" text-anchor="end" font-weight="400">ISSUED 2026-09-28 · FIELD RELEASE REQUIRED</text></svg>