 sans-serif" font-size="12" fill="#172534" text-anchor="middle" font-weight="400">M4 · 86 H</text><path d="M 558.2 583 L 558.2 311 A 48 48 0 0 1 654.2 311 L 654.2 583 Z" fill="#d9e5f4" stroke="#295fbb" stroke-width="2"/><text x="606.2" y="423" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#172534" text-anchor="middle" font-weight="400">M5 · 80 H</text><line x1="75" y1="140" x2="660.0" y2="140" stroke="#295fbb" stroke-width="1"/><line x1="75" y1="134" x2="75" y2="146" stroke="#295fbb" stroke-width="1"/><line x1="660.0" y1="134" x2="660.0" y2="146" stroke="#295fbb" stroke-width="1"/><text x="367.5" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400">146.25 plan control / F</text><line x1="81.0" y1="615" x2="654.2" y2="615" stroke="#295fbb" stroke-width="1"/><line x1="81.0" y1="609" x2="81.0" y2="621" stroke="#295fbb" stroke-width="1"/><line x1="654.2" y1="609" x2="654.2" y2="621" stroke="#295fbb" stroke-width="1"/><text x="367.6" y="607" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400">143.30 overall proposed span · x 1.50 to 144.80</text><line x1="685" y1="583" x2="685" y2="215" stroke="#295fbb" stroke-width="1"/><line x1="679" y1="583" x2="691" y2="583" stroke="#295fbb" stroke-width="1"/><line x1="679" y1="215" x2="691" y2="215" stroke="#295fbb" stroke-width="1"/><text x="702" y="399.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400" transform="rotate(-90 702 399.0)">92 max proposed</text><text x="367.56" y="199" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#295fbb" text-anchor="middle" font-weight="400">R12 proposed</text><text x="55" y="677" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">MIR-01 · FIVE GRADUATED PROPOSED ARCHES</text><text x="55" y="703" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">Centers x 13.5 / 43.3 / 73.14 / 103.0 / 132.8; each 24 W.</text><text x="55" y="729" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">Heights 80 / 86 / 92 / 86 / 80; clear gaps 5.80 / 5.84 / 5.86 / 5.80.</text><text x="55" y="755" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#172534" text-anchor="start" font-weight="400">These illustrate design intent. Field templates and glazier cut sizes control fabrication.</text><text x="55" y="819" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#875700" text-anchor="start" font-weight="400">LGT-02 · LIGHT THE SIDES + ARCH HEAD</text><text x="55" y="844" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#875700" text-anchor="start" font-weight="400">76.3746 ft net = Σ [2 ×(H −12) +π ×12] /12; no bottom edges.</text><text x="55" y="869" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#875700" text-anchor="start" font-weight="400">Do not order curved channel from this elevation; supplier details each bend and cut.</text><text x="55" y="894" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#875700" text-anchor="start" font-weight="400">Backing, glass assembly, mechanical retention and access remain trade-designed.</text><line x1="38" y1="986" x2="722" y2="986" stroke="#c7d3e0" stroke-width="1"/><text x="38" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#172534" text-anchor="start" font-weight="400">TRC REHEARSAL ROOM 2 · CURRENT WEB DRAWING v1.5 · DIMENSIONS IN INCHES</text><text x="722" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#875700" text-anchor="end" font-weight="400">ISSUED 2026-09-28 · FIELD RELEASE REQUIRED</text></svg>